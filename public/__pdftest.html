<!doctype html><html><body><script type="module">
import { exportInteractiveGroupReport, buildInteractiveGroupData } from '/src/utils/npiInteractivePdf.ts';
const mkSite=(label,custs,rev)=>({label,site:'wf',rows:custs.flatMap((c,ci)=>Array.from({length:4},(_,mi)=>{const d=new Date(2026,mi,10+ci);return{date:d,customer:c,revenue:rev/4,status:'C',isNpi:true,partNo:'P'+ci,partDesc:'desc'};})),hasNpiCol:true,customers:custs});
const ds1=mkSite('Schivo Waterford',['Intuitive Surgical Sarl','Medtronic','Boston Scientific','Stryker','Smith+Nephew','Zimmer Biomet','Cook Medical','Edwards Lifesciences','Becton Dickinson','Olympus','Conmed','Karl Storz','Getinge','Mako','Aspen'],1500000);
const ds2=mkSite('Schivo PlainView',['Customer A','Customer B'],600000);
const data=buildInteractiveGroupData([{ds:ds1,label:'Schivo Waterford',companyRevenue:95000000},{ds:ds2,label:'Schivo PlainView',companyRevenue:19000000}],'2026',false,{projectedRevenue:114000000,npviBenchmark:4.28},12,10);
const blob=await exportInteractiveGroupReport(data);
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='exec.pdf';document.body.appendChild(a);
window.__pdf=ArrayBuffer.from(await blob.arrayBuffer());
const buf=await blob.arrayBuffer();
const b64=btoa(String.fromCharCode(...new Uint8Array(buf)));
window.__done=true;window.__b64=b64;
console.log('PDF bytes',blob.size);
</script><div id="ok">ready</div></body></html>
